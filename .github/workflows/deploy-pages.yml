# Publishes ONLY the final_dashboard/ folder to GitHub Pages.
# Active when Settings → Pages → Source = "GitHub Actions".
# The old generated dashboard (output/, build_dashboard*.py, root index.html)
# is intentionally NOT deployed.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "final_dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure .nojekyll exists in publish dir
        run: touch final_dashboard/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact (final_dashboard only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
